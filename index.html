<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaima Alahmadi — Software Engineer & UI/UX Designer</title>
<meta name="description" content="Portfolio of Shaima Alahmadi, software engineering graduate focused on front-end development and UI/UX design.">
<meta name="theme-color" content="#f5f5f7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👩‍💻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7;
  --accent:#0071e3; --accent-h:#0077ed; --nav:rgba(255,255,255,.72); --shadow:0 4px 24px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","IBM Plex Sans Arabic","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#101012; --card:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
  --accent:#2997ff; --accent-h:#409cff; --nav:rgba(22,22,23,.72); --shadow:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.47;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:start}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] body{line-height:1.6}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1024px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:600;font-size:17px;color:var(--text)}
.brand:hover{text-decoration:none}
.links{display:flex;gap:26px;align-items:center}
.links a{color:var(--text);opacity:.8;font-size:12px;transition:opacity .2s}
.links a:hover,.links a.active{opacity:1;text-decoration:none}
.links a.active{font-weight:600}
.tools{display:flex;gap:4px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:background .2s;text-align:center}
.icon-btn:hover{background:var(--bg2)}
.lang-btn{width:auto;padding:0 12px;border-radius:980px;font-size:13px;font-weight:600}
.menu-btn{display:none}
@media(max-width:860px){
  .links{position:absolute;top:48px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 22px 16px;display:none;align-items:flex-start}
  .links.open{display:flex}
  .links a{font-size:17px;padding:10px 0;width:100%}
  .menu-btn{display:grid}
}

/* LAYOUT */
section{padding:110px 22px}
.wrap{max-width:1024px;margin:0 auto}
.alt{background:var(--bg2)}
h2{font-size:clamp(32px,5vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
[dir=rtl] h2{line-height:1.3}
.lead{font-size:clamp(19px,2.4vw,24px);color:var(--muted);max-width:720px;line-height:1.4;letter-spacing:-.01em}
.head{margin-bottom:56px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:980px;font-size:17px;font-weight:400;transition:background .2s,transform .15s;text-align:center}
.btn:hover{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.ghost{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.ghost:hover{background:var(--accent);color:#fff}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* HERO */
.hero{text-align:center;padding:96px 22px 80px;min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:center;align-items:center}
.avatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:600;color:#fff;background:linear-gradient(135deg,#5ac8fa,#0071e3 55%,#5e5ce6);box-shadow:var(--shadow);margin-bottom:28px;animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);padding:6px 14px;border-radius:980px;font-size:14px;color:var(--muted);margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158}
.hero h1{font-size:clamp(44px,9vw,92px);line-height:1.03;font-weight:700;letter-spacing:-.035em;max-width:900px}
[dir=rtl] .hero h1{line-height:1.25;font-size:clamp(40px,8vw,80px)}
.grad{background:linear-gradient(90deg,#0071e3,#5e5ce6 50%,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero p{font-size:clamp(19px,2.6vw,28px);color:var(--muted);max-width:680px;margin:22px auto 36px;line-height:1.3;letter-spacing:-.01em}
[dir=rtl] .hero p{line-height:1.6}
.socials{display:flex;gap:10px;margin-top:40px;justify-content:center}
.socials a{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:20px;color:var(--text);transition:background .2s,transform .2s}
.socials a:hover{background:var(--accent);color:#fff;transform:translateY(-3px);text-decoration:none}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--card);border-radius:24px;padding:32px 24px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:clamp(40px,6vw,60px);letter-spacing:-.03em;line-height:1;font-weight:700}
.stat span{color:var(--muted);font-size:15px;display:block;margin-top:10px}
@media(max-width:780px){.stats{grid-template-columns:1fr 1fr}}

/* ABOUT */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}
.about p{font-size:19px;color:var(--muted);margin-bottom:18px}
.about p strong{color:var(--text);font-weight:600}
.facts{background:var(--bg2);border-radius:24px;padding:28px;display:grid;gap:18px}
.fact{display:flex;gap:14px;align-items:flex-start}
.fact .ic{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px;color:var(--accent);flex:none}
.fact small{display:block;color:var(--muted);font-size:13px}
.fact div{font-size:16px;font-weight:500}
@media(max-width:780px){.about{grid-template-columns:1fr;gap:32px}}

/* SEGMENTED */
.seg{display:inline-flex;background:var(--bg2);padding:3px;border-radius:980px;margin-bottom:36px;max-width:100%;overflow-x:auto}
.alt .seg{background:var(--bg)}
.seg button{padding:8px 20px;border-radius:980px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:all .25s;text-align:center}
.seg button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button[aria-selected="true"]{background:#3a3a3c}

/* TIMELINE */
.tl{display:grid;gap:16px}
.item{background:var(--card);border-radius:24px;padding:28px 32px;box-shadow:var(--shadow);display:grid;grid-template-columns:150px 1fr;gap:24px;transition:transform .3s}
.item:hover{transform:scale(1.01)}
.when{color:var(--muted);font-size:14px;padding-top:4px}
.item h3{font-size:21px;letter-spacing:-.01em;line-height:1.25}
.item .org{color:var(--accent);font-size:15px;margin:2px 0 8px;font-weight:500}
.item p{color:var(--muted);font-size:16px}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:12px;color:var(--accent);font-size:15px;font-weight:500}
.lnk:hover{text-decoration:underline}
@media(max-width:640px){.item{grid-template-columns:1fr;gap:6px;padding:24px}}
.panel[hidden]{display:none}

/* PROJECT TILES */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tile{border-radius:28px;padding:40px 36px 0;min-height:560px;display:flex;flex-direction:column;text-align:start;color:#fff;position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:scale(1.02)}
.tile.a{background:linear-gradient(160deg,#1d1d1f,#2c2c54 60%,#5e5ce6)}
.tile.b{background:linear-gradient(160deg,#0a2540,#0071e3 70%,#5ac8fa)}
.tile small{font-size:14px;opacity:.75}
.tile h3{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 12px}
.tile p{font-size:17px;opacity:.85;max-width:380px}
.tile .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{background:rgba(255,255,255,.16);padding:4px 12px;border-radius:980px;font-size:13px}
.plus{position:absolute;top:24px;inset-inline-end:24px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;transition:background .2s,transform .3s;z-index:2}
.tile:hover .plus{background:#fff;color:#000;transform:rotate(90deg)}
.shot{margin-top:auto;padding-top:28px;height:270px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden}
.shot img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.tile:hover .shot img{transform:scale(1.05) translateY(-4px)}
.tile.a .shot img{width:94%;height:230px;object-fit:cover;object-position:top;border-radius:14px 14px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.35)}
.tile.b .shot img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.35))}
@media(max-width:780px){.tiles{grid-template-columns:1fr}.tile{min-height:520px}}

/* DIALOG */
dialog{border:0;border-radius:28px;max-width:640px;width:calc(100% - 32px);padding:40px;background:var(--card);color:var(--text);margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog[open]{animation:dlg .35s cubic-bezier(.2,.8,.2,1)}
@keyframes dlg{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
dialog h3{font-size:30px;letter-spacing:-.02em;line-height:1.15;margin:6px 0 10px;padding-inline-end:40px}
dialog .sub{color:var(--muted);margin-bottom:20px}
dialog ul{padding-inline-start:20px;display:grid;gap:12px;font-size:17px}
dialog .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
dialog .tag{background:var(--bg2);color:var(--muted)}
dialog.wide{max-width:780px;max-height:90vh;overflow-y:auto}
.close{position:absolute;top:20px;inset-inline-end:20px;width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:16px;text-align:center}
.close:hover{background:var(--line)}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -8px 24px;padding:0 8px 8px}
.gallery figure{flex:none;scroll-snap-align:start;max-width:85%}
.gallery img{height:240px;width:auto;max-width:100%;border-radius:16px;cursor:zoom-in;box-shadow:var(--shadow);background:var(--bg2);display:block;transition:transform .3s}
.gallery img:hover{transform:scale(1.02)}
.gallery figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
@media(max-width:600px){.gallery img{height:190px}dialog{padding:28px 22px}}

/* LIGHTBOX */
#lb{max-width:min(1000px,94vw);width:auto;max-height:92vh;overflow:auto;padding:0;background:var(--card);border-radius:20px}
#lb img{display:block;max-width:100%;height:auto;margin:auto}
#lb .close{position:fixed;background:rgba(255,255,255,.92);color:#000;z-index:5}
#lbCap{padding:14px 20px;text-align:center;font-size:14px;color:var(--muted)}

/* HONORS */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.award{background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow);transition:transform .3s;overflow:hidden}
.award:hover{transform:translateY(-6px)}
.award .ic{font-size:30px;color:var(--accent);margin-bottom:16px}
.award h3{font-size:19px;letter-spacing:-.01em;line-height:1.3;margin-bottom:8px}
.award p{color:var(--muted);font-size:15px}
.award .ph{margin:-28px -28px 20px;aspect-ratio:3/2;overflow:hidden;cursor:zoom-in;background:var(--bg2);display:block;padding:10px}
.award .ph img{width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.8,.2,1);display:block}
.award .ph:hover img{transform:scale(1.04)}
.award.has-img .ic{display:none}
.award.big{grid-column:1/-1;background:linear-gradient(135deg,#0071e3,#5e5ce6);color:#fff}
.award.big .ic,.award.big p{color:#fff;opacity:.92}
.award.big.has-img{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}
.award.big .ph{margin:-28px 0 -28px -28px;margin-inline:-28px 0;aspect-ratio:3/2;background:rgba(255,255,255,.95);padding:16px}
.award.big h3{font-size:26px}
.award.big p{font-size:17px}
.award .tagline{display:inline-block;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:980px;margin-bottom:12px}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}.award.big.has-img{grid-template-columns:1fr;gap:0}.award.big .ph{margin:-28px -28px 20px}}
@media(max-width:600px){.grid3{grid-template-columns:1fr}}

/* LETTERS */
.letters{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.letter{background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;transition:transform .3s}
.letter:hover{transform:translateY(-6px)}
.lp{height:200px;overflow:hidden;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;position:relative;background:#fff}
.lp img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s;display:block}
.lp:hover img{transform:scale(1.04)}
.lp::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(transparent,rgba(0,0,0,.18))}
.letter .who{display:flex;gap:14px;align-items:center}
.letter .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#5ac8fa,#0071e3);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.letter h3{font-size:18px;line-height:1.25}
.letter small{color:var(--muted);font-size:14px;display:block;line-height:1.35}
.letter blockquote{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.letter p{color:var(--muted);font-size:15px;flex:1}
.letter .btn{align-self:flex-start;padding:8px 18px;font-size:15px}
@media(max-width:780px){.letters{grid-template-columns:1fr}}

/* SKILLS */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:var(--card);padding:12px 22px;border-radius:980px;font-size:17px;box-shadow:var(--shadow);transition:transform .2s,background .2s,color .2s;cursor:default}
.chip:hover{transform:translateY(-3px);background:var(--accent);color:#fff}

/* CERTS */
.certs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cert{display:flex;gap:16px;align-items:center;background:var(--card);padding:18px 22px;border-radius:20px;box-shadow:var(--shadow);font-size:16px;line-height:1.35}
.cert .ic{width:44px;height:44px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:22px;color:var(--accent);flex:none}
.cert small{display:block;color:var(--muted);font-size:13px}
@media(max-width:700px){.certs{grid-template-columns:1fr}}

/* CONTACT */
.contact{text-align:center}
.contact h2{font-size:clamp(36px,7vw,72px);letter-spacing:-.03em}
.contact .lead{margin:0 auto 36px}
footer{padding:28px 22px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

<!-- ABOUT -->
<section id="about">
  <div class="wrap">

  {img:'letters/arwa.webp', ini:{en:'AA',ar:'أ'}, name:{en:'Dr. Arwa N. Aledaily, PhD',ar:'د. أروى العديلي'}, role:{en:'Assistant Professor · College of Computer Science & Engineering, University of Hail',ar:'أستاذ مساعد · كلية علوم وهندسة الحاسب، جامعة حائل'},
   q:{en:'"An exceptional student."',ar:'«طالبة استثنائية.»'},
   d:{en:'Taught me Introduction to Software Engineering and Ethics in Software Engineering, where I earned A+ in both. Highlights my responsibility, cooperation, and teamwork.', ar:'درّستني مقرري مقدمة في هندسة البرمجيات وأخلاقيات هندسة البرمجيات وحصلت فيهما على A+. وأشادت بمسؤوليتي وتعاوني وعملي ضمن الفريق.'}},
  {img:'letters/salwa.webp', ini:{en:'SS',ar:'س'}, name:{en:'Dr. Salwa Saad',ar:'د. سلوى سعد'}, role:{en:'Assistant Professor · College of Computer Science & Engineering, University of Hail',ar:'أستاذ مساعد · كلية علوم وهندسة الحاسب، جامعة حائل'},
   q:{en:'"I highly recommend Shaima without reservation."',ar:'«أوصي بها بلا تحفظ.»'},
   d:{en:'My professor in SENG-480 (A+). Notes my analytical, structured thinking, clear presentations, and ability to work independently and in a team.', ar:'أستاذتي في مقرر SENG-480 (A+). أشادت بتفكيري التحليلي المنظم، وعروضي الواضحة، وقدرتي على العمل باستقلالية وضمن فريق.'}}
];

const SKILLS = {
  tech:{en:['Angular','HTML5 / CSS3','TypeScript','JavaScript','Python','Django','SQL','REST APIs','Figma','Git & GitHub'], ar:['Angular','HTML5 / CSS3','TypeScript','JavaScript','Python','Django','SQL','REST APIs','Figma','Git & GitHub']},
  proc:{en:['SDLC','Responsive design','Component-based architecture','Azure DevOps','Agile / Scrum','Testing','UI/UX wireframing & prototyping'], ar:['SDLC','التصميم المتجاوب (Responsive)','البنية المعتمدة على المكوّنات','Azure DevOps','Agile / Scrum','الاختبار (Testing)','تصميم هياكل ونماذج UI/UX']},
  soft:{en:['Strategic planning','Team leadership','Problem-solving','Public speaking','Project management'], ar:['التخطيط الاستراتيجي','قيادة الفرق','حل المشكلات','الإلقاء والتحدث أمام الجمهور','إدارة المشاريع']}
};

const CERTS = [
  {t:{en:'Google UX Design Professional Certificate',ar:'شهادة جوجل المهنية في تصميم تجربة المستخدم'}, o:{en:'Google',ar:'جوجل'}},
  {t:{en:'AWS Certified Cloud Practitioner',ar:'شهادة AWS لممارس الحوسبة السحابية'}, o:{en:'Amazon Web Services',ar:'أمازون ويب سيرفيسز'}},
  {t:{en:'HCIA-IoT Certificate',ar:'شهادة HCIA في إنترنت الأشياء'}, o:{en:'SDA & Huawei',ar:'SDA وهواوي'}},
  {t:{en:'Cyber Security Program',ar:'برنامج الأمن السيبراني'}, o:{en:'NCA & KAUST',ar:'الهيئة الوطنية للأمن السيبراني وكاوست'}},
  {t:{en:'Applications Development Bootcamp',ar:'معسكر تطوير التطبيقات'}, o:{en:'Microsoft',ar:'مايكروسوفت'}},
  {t:{en:'UI/UX Program',ar:'برنامج UI/UX'}, o:{en:'Misk Foundation',ar:'مؤسسة مسك'}},
  {t:{en:'Financial Sustainability Nanodegree',ar:'نانو ديغري الاستدامة المالية'}, o:{en:'Banque Saudi Fransi (BSF)',ar:'البنك السعودي الفرنسي'}},
  {t:{en:'UX Virtual Work Experience',ar:'تجربة عمل افتراضية في تجربة المستخدم'}, o:{en:'stc',ar:'stc'}}
];

/* =====================================================================
   ENGINE
   ===================================================================== */
let lang = 'en', tab = 'exp', skillKey = 'tech';
const L = o => (o && typeof o === 'object' && !Array.isArray(o)) ? (o[lang] ?? o.en) : o;
const root = document.documentElement;

/* Theme */
const themeIcon = $('#themeIcon');
const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const moon = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function setTheme(t){ root.dataset.theme = t; themeIcon.innerHTML = t === 'dark' ? sun : moon;
  $('meta[name=theme-color]').content = t === 'dark' ? '#000000' : '#f5f5f7';
  try{ localStorage.setItem('theme', t) }catch(e){} }
let savedTheme = null; try{ savedTheme = localStorage.getItem('theme') }catch(e){}
setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

/* Render everything for the current language */
function render(){
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = L(UI.title);
  $('#lang').textContent = lang === 'ar' ? 'EN' : 'عربي';
  $('#avatar').textContent = lang === 'ar' ? 'ش أ' : 'SA';
  $$('[data-i]').forEach(el => el.textContent = L(UI[el.dataset.i]));
  $$('[data-ih]').forEach(el => el.innerHTML = L(UI[el.dataset.ih]));

  $('#aboutText').innerHTML = ABOUT[lang].map(p => `<p>${p}</p>`).join('');
  $('#facts').innerHTML = FACTS.map(f => `<div class="fact"><div class="ic"><svg viewBox="0 0 24 24">${f.ic}</svg></div><div><small>${L(f.k)}</small>${L(f.v)}</div></div>`).join('');

  renderTimeline();

  $('#tiles').innerHTML = Object.entries(PROJECTS).map(([k,p]) => `
    <button class="tile ${p.cls}" data-project="${k}" aria-haspopup="dialog">
      <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <div>
        <small>${L(p.kind)}</small>
        <h3>${p.title}</h3>
        <p>${L(p.blurb)}</p>
        <div class="tags">${p.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="shot"><img src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.remove()"></div>
    </button>`).join('');

  $('#awardList').innerHTML = AWARDS.map(a => `
    <figure class="award${a.img ? ' has-img' : ''}${a.big ? ' big' : ''}">
      ${a.img ? `<div class="ph" data-lb="${a.img}" data-cap="${L(a.t)}"><img loading="lazy" src="${a.img}" alt="${L(a.t)}" onerror="const c=this.closest('.award');c.classList.remove('has-img');this.parentElement.remove()"></div>` : ''}
      <div>
        <div class="ic"><svg viewBox="0 0 24 24" style="font-size:30px">${ico[a.i]}</svg></div>
        ${a.tag ? `<span class="tagline">${L(a.tag)}</span>` : ''}
        <h3>${L(a.t)}</h3><p>${L(a.d)}</p>
      </div>
    </figure>`).join('');
  $('#awardCount').dataset.to = AWARDS.length;

  $('#letterList').innerHTML = LETTERS.map(l => `
    <article class="letter">
      <div class="lp" data-lb="${l.img}" data-cap="${L(l.name)}"><img loading="lazy" src="${l.img}" alt="${L(l.name)}"></div>
      <div class="who"><div class="av">${L(l.ini)}</div><div><h3>${L(l.name)}</h3><small>${L(l.role)}</small></div></div>
      <blockquote>${L(l.q)}</blockquote>
      <p>${L(l.d)}</p>
      <button class="btn ghost" data-lb="${l.img}" data-cap="${L(l.name)}"><svg viewBox="0 0 24 24">${ico.doc}</svg> ${L(UI.read_letter)}</button>
    </article>`).join('');

  renderSkills();
  $('#certList').innerHTML = CERTS.map(c => `<div class="cert"><div class="ic"><svg viewBox="0 0 24 24">${ico.star}</svg></div><div>${L(c.t)}<small>${L(c.o)}</small></div></div>`).join('');
}
function renderTimeline(){
  const rows = tab === 'exp' ? EXP : EDU;
  $('#tl').innerHTML = rows.map(r => `
    <div class="item"><div class="when">${L(r.when)}</div><div>
      <h3>${L(r.t)}</h3><div class="org">${L(r.org)}</div><p>${L(r.d)}</p>
      ${r.cert ? `<button class="lnk" data-lb="${r.cert}" data-cap="${L(r.t)}"><svg viewBox="0 0 24 24">${ico.doc}</svg> ${L(UI.view_cert)}</button>` : ''}
    </div></div>`).join('');
}
function renderSkills(){ $('#chips').innerHTML = SKILLS[skillKey][lang].map(s => `<span class="chip">${s}</span>`).join(''); }

/* Language */
let savedLang = null; try{ savedLang = localStorage.getItem('lang') }catch(e){}
lang = savedLang || ((navigator.language || 'en').toLowerCase().startsWith('ar') ? 'ar' : 'en');
$('#lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try{ localStorage.setItem('lang', lang) }catch(e){} render(); observeNew(); };
render();

/* Mobile menu */
const menu = $('#menu'), links = $('#links');
menu.onclick = () => { const o = links.classList.toggle('open'); menu.setAttribute('aria-expanded', o); };
links.addEventListener('click', e => { if(e.target.closest('a')){ links.classList.remove('open'); menu.setAttribute('aria-expanded', false); } });

/* Active nav link */
const navObs = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting) $$('#links a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
}), {rootMargin:'-45% 0px -50% 0px'});
$$('main section[id]').forEach(s => navObs.observe(s));

/* Reveal + counters */
function count(el){
  const to = +el.dataset.to, dec = +(el.dataset.dec||0), suf = el.dataset.suffix||'';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = to.toFixed(dec)+suf; return; }
  const t0 = performance.now(), d = 1400;
  (function tick(t){ const p = Math.min((t-t0)/d,1), e = 1-Math.pow(1-p,3);
    el.textContent = (to*e).toFixed(dec)+suf; if(p<1) requestAnimationFrame(tick); })(t0);
}
const rv = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ e.target.classList.add('in'); $$('[data-to]', e.target).forEach(count); rv.unobserve(e.target); }
}), {threshold:.12});
function observeNew(){ $$('.rv:not(.in)').forEach(el => rv.observe(el)); }
observeNew();

/* Tabs */
$('#expTabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
  tab = b.dataset.tab; $$('#expTabs button').forEach(x => x.setAttribute('aria-selected', x === b)); renderTimeline(); });
$('#skillTabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
  skillKey = b.dataset.k; $$('#skillTabs button').forEach(x => x.setAttribute('aria-selected', x === b)); renderSkills(); });

/* Project dialog */
const dlg = $('#dlg');
document.addEventListener('click', e => {
  const t = e.target.closest('[data-project]');
  if(!t) return;
  const p = PROJECTS[t.dataset.project];
  $('#dKind').textContent = L(p.kind); $('#dTitle').textContent = p.title; $('#dSub').textContent = L(p.sub);
  $('#dGallery').innerHTML = p.shots.map(s => `<figure><img data-lb="${s.src}" data-cap="${p.title} — ${L(s.cap)}" loading="lazy" src="${s.src}" alt="${p.title} — ${L(s.cap)}" onerror="this.closest('figure').remove()"><figcaption>${L(s.cap)}</figcaption></figure>`).join('');
  $('#dList').innerHTML = L(p.list).map(i => `<li>${i}</li>`).join('');
  $('#dTags').innerHTML = p.tags.map(i => `<span class="tag">${i}</span>`).join('');
  $('#dLinks').innerHTML = p.link ? `<a class="btn primary" style="margin-top:24px" href="${p.link.href}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">${ico.doc}</svg> ${L(UI[p.link.label])}</a>` : '';
  dlg.showModal();
});
$('#dClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });

/* Lightbox: anything with data-lb opens full size */
const lb = $('#lb');
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lb]'); if(!el) return;
  $('#lbImg').src = el.dataset.lb; $('#lbImg').alt = el.dataset.cap || ''; $('#lbCap').textContent = el.dataset.cap || '';
  lb.showModal(); lb.scrollTop = 0;
});
$('#lbClose').onclick = () => lb.close();
lb.addEventListener('click', e => { if(e.target === lb) lb.close(); });
</script>
</body>
</html>
